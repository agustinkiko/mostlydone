# DISABLED until Kiko confirms. This workflow runs only by hand
# (workflow_dispatch) and nothing triggers it automatically.
# It builds binaries and a container image. It does not create a GitHub release.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag for the image, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build UI
        run: make ui
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: internal/webui/dist
          include-hidden-files: true

  binaries:
    needs: ui
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: internal/webui/dist
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" -o mostlydone ./cmd/mostlydone
      - uses: actions/upload-artifact@v4
        with:
          name: mostlydone-${{ inputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: mostlydone

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.version }}
            ghcr.io/${{ github.repository }}:latest
