# MostlyDone on the homelab k3s node (single node, Traefik, local-path storage).
#
# Kubernetes names: namespace, deployment, service, PVC "mostlydone-data" and
# Secret "mostlydone-admin". MD-002 (2026-11-15) renamed these from the app's
# earlier name. The live cluster may still run under the old names, so DO NOT
# just `kubectl apply` this file over a running install. Do the cutover in
# deploy/CUTOVER.md first, or the app starts on a new, empty volume and fails
# until the new Secret exists.
#
# Not in this file, on purpose:
#   - Secret "mostlydone-admin" (keys: email, password). Created once by hand so
#     the password is never written to disk here.
#   - The image. It is a local image (no registry). Load it on the node with:
#       sudo k3s ctr -n k8s.io images import mostlydone-<tag>.tar
#
# Apply:  kubectl apply -f deploy/mostlydone.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: mostlydone
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mostlydone-data
  namespace: mostlydone
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mostlydone
  namespace: mostlydone
  labels:
    app: mostlydone
spec:
  replicas: 1
  # One SQLite file, one writer: never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mostlydone
  template:
    metadata:
      labels:
        app: mostlydone
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mostlydone
          image: mostlydone:20261115
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MOSTLYDONE_ADDR
              value: ":8080"
            - name: MOSTLYDONE_DB
              value: /data/mostlydone.db
            # The public URL is HTTPS (Cloudflare), so cookies are HTTPS-only.
            - name: MOSTLYDONE_SECURE_COOKIES
              value: "true"
            # All traffic arrives through the Cloudflare tunnel, which sets this.
            - name: MOSTLYDONE_CLIENT_IP_HEADER
              value: CF-Connecting-IP
            - name: GOMEMLIMIT
              value: 96MiB
            - name: MOSTLYDONE_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: mostlydone-admin
                  key: email
            - name: MOSTLYDONE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mostlydone-admin
                  key: password
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            # The root filesystem is read-only; SQLite needs scratch space for
            # large sorts and transactions.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mostlydone-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mostlydone
  namespace: mostlydone
spec:
  selector:
    app: mostlydone
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mostlydone
  namespace: mostlydone
spec:
  ingressClassName: traefik
  rules:
    - host: mostlydone.jericoagustin.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mostlydone
                port:
                  number: 80
    # For when the mostlydone.app domain is registered and connected.
    - host: mostlydone.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mostlydone
                port:
                  number: 80
